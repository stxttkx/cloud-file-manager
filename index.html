<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文件中心</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#111111;
    --muted:#6b7280;
    --size:#f97316;
    --border:#e5e7eb;
    --card:#ffffff;
    --hover:#fafafa;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 64px;}
  header{margin-bottom:24px;}
  header h1{font-size:22px;margin:0 0 6px;}
  header p{margin:0;color:var(--muted);font-size:13px;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .toolbar input{
    flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--border);
    border-radius:10px;font-size:14px;outline:none;background:#fff;color:var(--text);
  }
  .toolbar input:focus{border-color:#111;}

  .list{display:flex;flex-direction:column;gap:12px;}

  .item{
    display:flex;gap:16px;padding:14px;background:var(--card);
    border:1px solid var(--border);border-radius:var(--radius);
    transition:background .15s ease,box-shadow .15s ease;
  }
  .item:hover{background:var(--hover);box-shadow:0 2px 10px rgba(0,0,0,.04);}

  .cover{
    width:88px;height:120px;flex:0 0 88px;border-radius:8px;overflow:hidden;
    background:#f3f4f6;position:relative;
  }
  .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .cover .fallback{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:28px;color:#9ca3af;
  }

  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}

  .title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .type-icon{
    width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:#f3f4f6;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#374151;
  }
  .name{
    font-size:15px;font-weight:600;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
  }
  .size{font-size:13px;font-weight:600;color:var(--size);}

  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{
    padding:2px 8px;border-radius:999px;background:#f3f4f6;
    font-size:11px;color:#4b5563;
  }
  .remark{font-size:12px;color:var(--muted);}

  .platforms{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .pf{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;border:1px solid transparent;
    font-size:12px;font-weight:600;color:#fff;cursor:pointer;
    user-select:none;transition:transform .12s ease,opacity .12s ease;
  }
  .pf:hover{transform:translateY(-1px);opacity:.92;}
  .pf:active{transform:translateY(0);}
  .pf .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85);}
  .pf.copied{outline:2px solid #111;outline-offset:2px;}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .2s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty{text-align:center;color:var(--muted);padding:48px 0;font-size:14px;}

  @media (max-width:520px){
    .cover{width:64px;height:88px;flex:0 0 64px;}
    .name{white-space:normal;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文件中心</h1>
    <p>统一管理分布在各平台的文件</p>
  </header>

  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索文件名、标签、备注..." />
  </div>

  <div class="list" id="list"></div>
</div>

<div class="toast" id="toast">已复制链接</div>

<script>
/* ============ 数据源 ============ */

  let DATA = [];
  const res = await fetch("/api/files");
  DATA = await res.json();
  render(DATA);

/* ============ 渲染 ============ */
const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function typeLabel(t){
  const map = { pdf:"PDF", fig:"FIG", zip:"ZIP", doc:"DOC", img:"IMG", video:"VID", file:"FILE" };
  return map[(t||"file").toLowerCase()] || (t||"FILE").toUpperCase().slice(0,4);
}

function render(items){
  if(!items.length){
    listEl.innerHTML = `<div class="empty">没有匹配的文件</div>`;
    return;
  }
  listEl.innerHTML = items.map(it => `
    <div class="item" data-id="${it.id}">
      <div class="cover">
        <div class="fallback">${escapeHtml(typeLabel(it.type))}</div>
        ${it.cover ? `<img src="${escapeHtml(it.cover)}" alt="" loading="lazy"
            onerror="this.style.display='none'">` : ""}
      </div>
      <div class="main">
        <div class="title-row">
          <span class="type-icon">${escapeHtml(typeLabel(it.type))}</span>
          <span class="name" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</span>
          <span class="size">${escapeHtml(it.size)}</span>
        </div>
        <div class="meta">
          <span>更新：${escapeHtml(it.updated_at || "-")}</span>
        </div>
        ${it.tags?.length ? `<div class="tags">
          ${it.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}
        </div>` : ""}
        ${it.remark ? `<div class="remark">备注：${escapeHtml(it.remark)}</div>` : ""}
        <div class="platforms">
          ${(it.platforms||[]).map(p => `
            <button class="pf" style="background:${escapeHtml(p.color)}"
              data-url="${escapeHtml(p.url)}">
              <span class="dot"></span>${escapeHtml(p.name)}
            </button>
          `).join("")}
        </div>
      </div>
    </div>
  `).join("");
}

/* ============ 复制 ============ */
const toast = document.getElementById("toast");
let toastTimer;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 1400);
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    return true;
  }catch(e){ return false; }
}

listEl.addEventListener("click", async (e) => {
  const btn = e.target.closest(".pf");
  if(!btn) return;
  const url = btn.dataset.url || "";
  const ok = await copyText(url);
  if(ok){
    btn.classList.add("copied");
    setTimeout(()=>btn.classList.remove("copied"), 600);
    showToast("已复制链接");
  }else{
    showToast("复制失败，请手动复制");
  }
});

/* ============ 搜索 ============ */
function filter(keyword){
  const k = keyword.trim().toLowerCase();
  if(!k){ render(DATA); return; }
  render(DATA.filter(it => {
    const hay = [
      it.name,
      it.remark,
      ...(it.tags||[]),
      ...(it.platforms||[]).map(p=>p.name)
    ].join(" ").toLowerCase();
    return hay.includes(k);
  }));
}

searchEl.addEventListener("input", e => filter(e.target.value));

render(DATA);
</script>
</body>
</html>
